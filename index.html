<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>ClayTint - Polymer Clay Colour Mixing Recipes</title>
    <meta
      name="description"
      content="Choose the clays you own, pick a target colour, and get a recipe to match it. Free polymer clay color mixing calculator."
    />
    <link rel="canonical" href="https://claytint.com/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ClayTint",
        "url": "https://claytint.com/"
      }
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ClayTint" />
    <meta property="og:url" content="https://claytint.com/" />
    <meta
      property="og:title"
      content="ClayTint - Polymer Clay Colour Mixing Recipes"
    />
    <meta
      property="og:description"
      content="Choose the clays you own, pick a target colour, and get a recipe to match it."
    />
    <meta property="og:image" content="https://claytint.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ClayTint - Polymer Clay Colour Mixing Recipes"
    />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />

    <meta
      name="theme-color"
      content="#efefec"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#151615"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      // Apply a saved light/dark choice before first paint
      try {
        const theme = localStorage.getItem('theme')
        if (theme === 'light' || theme === 'dark')
          document.documentElement.dataset.theme = theme
      } catch {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script>
      try {
        if (localStorage.getItem('claytint'))
          document.getElementById('root').replaceChildren()
      } catch {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
